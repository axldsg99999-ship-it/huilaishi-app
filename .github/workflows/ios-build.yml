name: iOS build and guarded TestFlight upload

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "*.json"
      - "*.webmanifest"
      - "assets/**"
      - "icons/**"
      - "partner/**"
      - "vendor/**"
      - "voice-packs/**"
      - "scripts/configure-ios.mjs"
      - "ios-native/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "*.json"
      - "*.webmanifest"
      - "assets/**"
      - "icons/**"
      - "partner/**"
      - "vendor/**"
      - "voice-packs/**"
      - "scripts/configure-ios.mjs"
      - "ios-native/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Archive, sign, and upload to App Store Connect/TestFlight (never releases to the App Store automatically)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CAPACITOR_VERSION: "8.5.0"
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  HUILAISHI_IOS_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  simulator-build:
    name: Unsigned iOS Simulator verification
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Verify the pinned Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "${DEVELOPER_DIR}"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version | tee ios-sdk-version.txt
          xcode_major="$(xcodebuild -version | awk 'NR==1 {split($2,v,"."); print v[1]}')"
          sdk_major="$(cut -d. -f1 ios-sdk-version.txt)"
          test "${xcode_major}" -ge 26
          test "${sdk_major}" -ge 26

      - name: Run web, content, audio, and release gates
        run: npm run check

      - name: Install pinned Capacitor iOS packages
        run: |
          npm install --no-save --package-lock=false \
            "@capacitor/core@${CAPACITOR_VERSION}" \
            "@capacitor/cli@${CAPACITOR_VERSION}" \
            "@capacitor/ios@${CAPACITOR_VERSION}"

      - name: Generate and verify the native iOS project
        shell: bash
        run: |
          set -euo pipefail
          node scripts/configure-ios.mjs stage
          ./node_modules/.bin/cap add ios
          node scripts/configure-ios.mjs configure

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App

      - name: Build without signing for the iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios-build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Audit the built app bundle
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find ios-build/DerivedData/Build/Products -type d -path '*Debug-iphonesimulator/App.app' -print -quit)"
          test -n "${app_path}"
          test -f "${app_path}/PrivacyInfo.xcprivacy"
          test -f "${app_path}/public/native-bootstrap.js"
          test ! -e "${app_path}/public/service-worker.js"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app_path}/Info.plist")" = "com.huilaishi.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${app_path}/Info.plist")" = "$(node -p 'require("./package.json").version')"
          mkdir -p ios-build/artifact
          ditto -c -k --sequesterRsrc --keepParent "${app_path}" ios-build/artifact/huilaishi-ios-simulator-unsigned.zip
          printf '%s\n' \
            'SIMULATOR ONLY — NOT AN IPA AND NOT INSTALLABLE ON AN IPHONE.' \
            'This artifact proves that the native wrapper compiles without Apple signing credentials.' \
            > ios-build/artifact/README-SIMULATOR-ONLY.txt

      - name: Upload the explicitly non-installable simulator artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: huilaishi-ios-simulator-unsigned-${{ github.run_number }}
          path: ios-build/artifact/
          if-no-files-found: error
          retention-days: 14

  testflight-upload:
    name: Signed App Store Connect upload
    needs: simulator-build
    if: github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight == true && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    environment: app-store-connect
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Generate the native iOS project
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm install --no-save --package-lock=false \
            "@capacitor/core@${CAPACITOR_VERSION}" \
            "@capacitor/cli@${CAPACITOR_VERSION}" \
            "@capacitor/ios@${CAPACITOR_VERSION}"
          node scripts/configure-ios.mjs stage
          ./node_modules/.bin/cap add ios
          node scripts/configure-ios.mjs configure

      - name: Validate secrets and install the distribution identity and profile
        id: signing
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE_SHA256: ${{ secrets.APPLE_CERTIFICATE_SHA256 }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          names=(APPLE_TEAM_ID APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_CERTIFICATE_SHA256 APPLE_PROVISIONING_PROFILE_BASE64 APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64)
          missing=()
          for name in "${names[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("${name}"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'TestFlight upload is blocked: missing %s\n' "${missing[*]}" >&2
            exit 1
          fi
          [[ "${APPLE_TEAM_ID}" =~ ^[A-Z0-9]{10}$ ]]
          [[ "${APP_STORE_CONNECT_API_KEY_ID}" =~ ^[A-Z0-9]{10}$ ]]
          [[ "${APPLE_CERTIFICATE_SHA256}" =~ ^([A-Fa-f0-9]{2}:?){32}$ ]]

          signing_dir="${RUNNER_TEMP}/huilaishi-ios-signing"
          keychain="${signing_dir}/build.keychain-db"
          certificate="${signing_dir}/distribution.p12"
          profile="${signing_dir}/app-store.mobileprovision"
          profile_plist="${signing_dir}/profile.plist"
          keychain_password="$(openssl rand -hex 24)"
          mkdir -p "${signing_dir}" "${HOME}/Library/MobileDevice/Provisioning Profiles" "${HOME}/.appstoreconnect/private_keys"
          printf '%s' "${APPLE_CERTIFICATE_BASE64}" | base64 -D > "${certificate}"
          printf '%s' "${APPLE_PROVISIONING_PROFILE_BASE64}" | base64 -D > "${profile}"
          printf '%s' "${APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64}" | base64 -D > "${HOME}/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "${certificate}" "${profile}" "${HOME}/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          actual_fingerprint="$(openssl pkcs12 -in "${certificate}" -clcerts -nokeys -passin env:APPLE_CERTIFICATE_PASSWORD 2>/dev/null | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected_fingerprint="$(printf '%s' "${APPLE_CERTIFICATE_SHA256}" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "${actual_fingerprint}" = "${expected_fingerprint}"

          security cms -D -i "${profile}" > "${profile_plist}"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${profile_plist}")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "${profile_plist}")"
          application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "${profile_plist}")"
          test "${application_identifier}" = "${APPLE_TEAM_ID}.com.huilaishi.app"
          PROFILE_PLIST="${profile_plist}" python3 - <<'PY'
          import datetime, os, plistlib
          with open(os.environ["PROFILE_PLIST"], "rb") as handle:
              profile = plistlib.load(handle)
          expiration = profile["ExpirationDate"].replace(tzinfo=datetime.timezone.utc)
          if expiration <= datetime.datetime.now(datetime.timezone.utc):
              raise SystemExit("Provisioning profile has expired")
          PY
          cp "${profile}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"

          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${certificate}" -k "${keychain}" -P "${APPLE_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain}"
          security list-keychains -d user -s "${keychain}"
          security find-identity -v -p codesigning "${keychain}" | grep -F "Apple Distribution"

          echo "keychain=${keychain}" >> "${GITHUB_OUTPUT}"
          echo "profile_uuid=${profile_uuid}" >> "${GITHUB_OUTPUT}"
          echo "profile_name=${profile_name}" >> "${GITHUB_OUTPUT}"

      - name: Archive and export the signed App Store Connect build
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ios-build/Huilaishi.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${APPLE_PROFILE_NAME}" \
            archive

          cp ios-native/ExportOptions.plist ios-build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :teamID ${APPLE_TEAM_ID}" ios-build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.huilaishi.app ${APPLE_PROFILE_NAME}" ios-build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath ios-build/Huilaishi.xcarchive \
            -exportPath ios-build/export \
            -exportOptionsPlist ios-build/ExportOptions.plist
          ipa="$(find ios-build/export -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "${ipa}"
          echo "IPA_PATH=${ipa}" >> "${GITHUB_ENV}"

      - name: Validate and upload to App Store Connect for TestFlight processing
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --validate-app -t ios -f "${IPA_PATH}" --apiKey "${APP_STORE_CONNECT_API_KEY_ID}" --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}"
          xcrun altool --upload-app -t ios -f "${IPA_PATH}" --apiKey "${APP_STORE_CONNECT_API_KEY_ID}" --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}"
          echo "Upload accepted for App Store Connect processing. This does not release the app or add external testers."

      - name: Remove temporary signing material
        if: always()
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          set +e
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "${KEYCHAIN_PATH}"; fi
          if [ -n "${PROFILE_UUID:-}" ]; then rm -f "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"; fi
          rm -rf "${RUNNER_TEMP}/huilaishi-ios-signing"
          rm -f "${HOME}/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
