name: Native store technical candidates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-candidates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google-play-aab:
    name: Signed Google Play AAB candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAPACITOR_VERSION: "8.5.0"
      ANDROID_PLATFORM: "36"
      ANDROID_BUILD_TOOLS: "36.0.0"
      HUILAISHI_ANDROID_VARIANT: "standard"
      HUILAISHI_ANDROID_VOICE_SCOPE: "l1"
      HUILAISHI_DISTRIBUTION: "store"

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Run quality and store-candidate gates
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          mkdir -p store-build-output
          node scripts/validate-store-readiness.mjs --json > store-build-output/store-readiness-report.json

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Install pinned Capacitor packages
        shell: bash
        run: |
          npm install --no-save --package-lock=false \
            "@capacitor/core@${CAPACITOR_VERSION}" \
            "@capacitor/cli@${CAPACITOR_VERSION}" \
            "@capacitor/android@${CAPACITOR_VERSION}"

      - name: Generate the isolated store package
        shell: bash
        run: |
          set -euo pipefail
          node scripts/configure-android.mjs prepare
          node scripts/configure-android.mjs stage
          ./node_modules/.bin/cap add android
          node scripts/configure-android.mjs configure
          ./node_modules/.bin/cap sync android
          node scripts/configure-android.mjs verify
          test ! -e native-www/partner-live.js
          test ! -e native-www/partner-live.css
          test ! -e native-www/partner/manual-peer.js
          test -f native-www/privacy.html
          test -f native-www/support.html
          test -f native-www/terms.html

      - name: Build and sign the AAB technical candidate
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          names=(ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_CERT_SHA256)
          for name in "${names[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required signing secret: ${name}" >&2
              exit 1
            fi
          done

          keystore="${RUNNER_TEMP}/huilaishi-play-upload.p12"
          trap 'rm -f "${keystore}"' EXIT
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          chmod 600 "${keystore}"

          actual_cert="$(keytool -J-Duser.language=en -list -v \
            -keystore "${keystore}" -storetype PKCS12 \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" -alias "${ANDROID_KEY_ALIAS}" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 \
            | tr '[:lower:]' '[:upper:]' | tr -d ':')"
          expected_cert="$(printf '%s' "${ANDROID_CERT_SHA256}" | tr '[:lower:]' '[:upper:]' | tr -d ':')"
          if [[ -z "${actual_cert}" || "${actual_cert}" != "${expected_cert}" ]]; then
            echo "AAB upload certificate fingerprint does not match the pinned signer." >&2
            exit 1
          fi

          (cd android && chmod +x gradlew && ./gradlew --no-daemon --stacktrace bundleRelease)
          unsigned="android/app/build/outputs/bundle/release/app-release.aab"
          output="store-build-output/huilaishi-google-play-12.6.3-technical-candidate.aab"
          test -f "${unsigned}"
          jarsigner \
            -keystore "${keystore}" -storetype PKCS12 \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" -keypass "${ANDROID_KEY_PASSWORD}" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar "${output}" "${unsigned}" "${ANDROID_KEY_ALIAS}"
          jarsigner -verify -strict -verbose -certs "${output}"

          unzip -l "${output}" > store-build-output/aab-inventory.txt
          if grep -Eq 'partner-live\.(js|css)|partner/manual-peer\.js' store-build-output/aab-inventory.txt; then
            echo "The store AAB contains the excluded human partner room." >&2
            exit 1
          fi
          for file in privacy.html support.html terms.html; do
            grep -q "base/assets/public/${file}" store-build-output/aab-inventory.txt
          done
          sha256sum "${output}" > store-build-output/SHA256SUMS.txt
          printf '%s\n' \
            'TECHNICAL CANDIDATE — DO NOT SUBMIT TO PRODUCTION UNTIL store-readiness-report.json has productionReady=true.' \
            'Package: com.huilaishi.app; target API: 36; distribution: store; human partner room: excluded.' \
            > store-build-output/README.txt

      - name: Upload signed technical candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: huilaishi-google-play-technical-candidate-${{ github.run_number }}
          path: store-build-output/
          if-no-files-found: error
          retention-days: 14
