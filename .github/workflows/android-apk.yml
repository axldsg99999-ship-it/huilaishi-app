name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAPACITOR_VERSION: "8.5.0"
      ANDROID_PLATFORM: "36"
      ANDROID_BUILD_TOOLS: "36.0.0"
      HUILAISHI_ANDROID_VARIANT: "samsung"

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Install pinned Capacitor packages
        shell: bash
        run: |
          npm install --no-save --package-lock=false \
            "@capacitor/core@${CAPACITOR_VERSION}" \
            "@capacitor/cli@${CAPACITOR_VERSION}" \
            "@capacitor/android@${CAPACITOR_VERSION}"

      - name: Stage native web assets and configure Android wrapper
        shell: bash
        run: |
          set -euo pipefail
          node scripts/configure-android.mjs prepare
          node scripts/configure-android.mjs stage
          ./node_modules/.bin/cap add android
          node scripts/configure-android.mjs configure
          ./node_modules/.bin/cap sync android
          node scripts/configure-android.mjs verify

      - name: Build installable debug APK
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            android-build-output/huilaishi-samsung-12.2.5-s1-debug.apk

      - name: Optionally build and sign release APK
        id: release
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          configured=0
          [ -n "${ANDROID_KEYSTORE_BASE64}" ] && configured=$((configured + 1))
          [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] && configured=$((configured + 1))
          [ -n "${ANDROID_KEY_ALIAS}" ] && configured=$((configured + 1))
          [ -n "${ANDROID_KEY_PASSWORD}" ] && configured=$((configured + 1))
          [ -n "${ANDROID_CERT_SHA256}" ] && configured=$((configured + 1))

          if [ "${configured}" -eq 0 ]; then
            echo "No release-signing secrets configured; debug APK only."
            echo "built=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${configured}" -ne 5 ]; then
            echo "Release signing is partially configured. Set all five ANDROID_* secrets." >&2
            exit 1
          fi

          keystore="${RUNNER_TEMP}/huilaishi-release.p12"
          aligned="${RUNNER_TEMP}/huilaishi-release-aligned.apk"
          trap 'rm -f "${keystore}" "${aligned}"' EXIT
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          chmod 600 "${keystore}"

          (cd android && ./gradlew --no-daemon --stacktrace assembleRelease)
          unsigned="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "${unsigned}"

          "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign" \
            -p -f 4 "${unsigned}" "${aligned}"
          "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" sign \
            --ks "${keystore}" \
            --ks-type PKCS12 \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out android-build-output/huilaishi-samsung-12.2.5-s1-release.apk \
            "${aligned}"
          cert_output="$("${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify \
            --verbose --print-certs \
            android-build-output/huilaishi-samsung-12.2.5-s1-release.apk)"
          printf '%s\n' "${cert_output}"
          actual_cert="$(printf '%s\n' "${cert_output}" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d ':')"
          expected_cert="$(printf '%s' "${ANDROID_CERT_SHA256}" \
            | tr '[:lower:]' '[:upper:]' | tr -d ':')"
          if [[ -z "${actual_cert}" || "${actual_cert}" != "${expected_cert}" ]]; then
            echo "Release certificate fingerprint does not match the pinned signer." >&2
            exit 1
          fi
          echo "built=true" >> "${GITHUB_OUTPUT}"

      - name: Verify Samsung package identity
        shell: bash
        run: |
          set -euo pipefail
          for apk in android-build-output/*.apk; do
            badging="$("${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt" dump badging "${apk}")"
            grep -q "package: name='com.huilaishi.app.samsung' versionCode='120205' versionName='12.2.5-samsung.1'" <<< "${badging}"
            grep -q "application-label:'会来事·三星版'" <<< "${badging}"
          done

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd android-build-output && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: huilaishi-samsung-android-v12.2.5-s1
          path: android-build-output/*
          if-no-files-found: error
          retention-days: 14
