name: Android launch diagnostics

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Public URL of the APK to install and launch
        required: true
        default: https://github.com/axldsg99999-ship-it/huilaishi-app/releases/download/v12.2.3/huilaishi-v12.2.3-android-beta.apk

permissions:
  contents: read

concurrency:
  group: android-launch-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-smoke:
    name: Android ${{ matrix.api-level }} / ${{ matrix.ram-mb }} MB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 24
            ram-mb: 768
            heap-mb: 128
          - api-level: 24
            ram-mb: 1536
            heap-mb: 256
          - api-level: 35
            ram-mb: 2048
            heap-mb: 512

    steps:
      - name: Check out diagnostics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the exact distributed APK
        shell: bash
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail
          mkdir -p android-smoke
          curl --fail --location --retry 3 --output android-smoke/app-under-test.apk "${APK_URL}"
          sha256sum android-smoke/app-under-test.apk | tee android-smoke/apk-sha256.txt
          test "$(stat --format='%s' android-smoke/app-under-test.apk)" -gt 1000000

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch three times, and capture logcat
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          ram-size: ${{ matrix.ram-mb }}M
          heap-size: ${{ matrix.heap-mb }}M
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -no-boot-anim -noaudio
            -gpu swiftshader_indirect -camera-back none
          script: bash scripts/android-launch-diagnostics.sh android-smoke/app-under-test.apk android-smoke

      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-launch-api-${{ matrix.api-level }}-${{ matrix.ram-mb }}mb
          path: android-smoke/**
          if-no-files-found: error
          retention-days: 14
