name: Android launch diagnostics

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Optional Android APK workflow run ID (preferred over apk_url)
        required: false
        default: ""
      artifact_name:
        description: Artifact name in build_run_id
        required: false
        default: huilaishi-android-v12.2.4
      apk_url:
        description: Public URL of the APK to install and launch
        required: false
        default: https://github.com/axldsg99999-ship-it/huilaishi-app/releases/download/v12.2.4/huilaishi-v12.2.4-android-fixed.apk

permissions:
  actions: read
  contents: read

concurrency:
  group: android-launch-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-smoke:
    name: Android ${{ matrix.api-level }} / ${{ matrix.ram-mb }} MB / ${{ matrix.expect }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 24
            ram-mb: 1536
            heap-mb: 128
            expect: compatibility
          - api-level: 35
            ram-mb: 768
            heap-mb: 128
            expect: app
          - api-level: 35
            ram-mb: 2048
            heap-mb: 512
            expect: app

    steps:
      - name: Check out diagnostics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the exact APK under test
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          APK_URL: ${{ inputs.apk_url }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p android-smoke
          if [[ -n "${BUILD_RUN_ID}" ]]; then
            gh run download "${BUILD_RUN_ID}" \
              --repo "${GITHUB_REPOSITORY}" \
              --name "${ARTIFACT_NAME}" \
              --dir android-smoke/build-artifact
            mapfile -t debug_apks < <(find android-smoke/build-artifact -type f -name '*debug.apk' -print)
            if [[ "${#debug_apks[@]}" -ne 1 ]]; then
              echo "Expected exactly one debug APK in ${ARTIFACT_NAME}; found ${#debug_apks[@]}." >&2
              exit 1
            fi
            cp "${debug_apks[0]}" android-smoke/app-under-test.apk
          else
            if [[ -z "${APK_URL}" ]]; then
              echo "Set either build_run_id or apk_url." >&2
              exit 1
            fi
            curl --fail --location --retry 3 --output android-smoke/app-under-test.apk "${APK_URL}"
          fi
          sha256sum android-smoke/app-under-test.apk | tee android-smoke/apk-sha256.txt
          test "$(stat --format='%s' android-smoke/app-under-test.apk)" -gt 1000000

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch three times, and capture logcat
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          ram-size: ${{ matrix.ram-mb }}M
          heap-size: ${{ matrix.heap-mb }}M
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -no-boot-anim -noaudio
            -gpu swiftshader_indirect -camera-back none
          script: >-
            bash scripts/android-launch-diagnostics.sh
            android-smoke/app-under-test.apk android-smoke ${{ matrix.expect }}

      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-launch-api-${{ matrix.api-level }}-${{ matrix.ram-mb }}mb-${{ matrix.expect }}
          path: android-smoke/**
          if-no-files-found: error
          retention-days: 14
