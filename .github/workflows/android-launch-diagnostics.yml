name: Android launch diagnostics

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Optional Android APK workflow run ID (preferred over apk_url)
        required: false
        default: ""
      artifact_name:
        description: Artifact name in build_run_id
        required: false
        default: huilaishi-samsung-android-v12.4.0-r1
      apk_url:
        description: Public URL of the APK to install and launch
        required: false
        default: https://github.com/axldsg99999-ship-it/huilaishi-app/releases/download/v12.4.0-samsung.1/huilaishi-samsung-12.4.0-r1-release.apk

permissions:
  actions: read
  contents: read

concurrency:
  group: android-launch-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-smoke:
    name: Android ${{ matrix.api-level }} / ${{ matrix.ram-mb }} MB / ${{ matrix.expect }} / ${{ matrix.apk-kind }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 24
            ram-mb: 1536
            heap-mb: 128
            expect: compatibility
            apk-kind: release
          - api-level: 35
            ram-mb: 768
            heap-mb: 128
            expect: app
            apk-kind: release
          - api-level: 35
            ram-mb: 2048
            heap-mb: 512
            expect: app
            apk-kind: release
          - api-level: 35
            ram-mb: 2048
            heap-mb: 512
            expect: app
            apk-kind: debug

    steps:
      - name: Check out diagnostics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the exact APK under test
        if: ${{ matrix.apk-kind != 'debug' || inputs.build_run_id != '' }}
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          APK_URL: ${{ inputs.apk_url }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
          APK_KIND: ${{ matrix.apk-kind }}
        run: |
          set -euo pipefail
          mkdir -p android-smoke
          if [[ -n "${BUILD_RUN_ID}" ]]; then
            gh run download "${BUILD_RUN_ID}" \
              --repo "${GITHUB_REPOSITORY}" \
              --name "${ARTIFACT_NAME}" \
              --dir android-smoke/build-artifact
            expected_name="huilaishi-samsung-12.4.0-r1-${APK_KIND}.apk"
            mapfile -t selected_apks < <(find android-smoke/build-artifact -type f -name "${expected_name}" -print)
            if [[ "${#selected_apks[@]}" -ne 1 ]]; then
              echo "Expected exactly one ${APK_KIND} APK named ${expected_name}; found ${#selected_apks[@]}." >&2
              exit 1
            fi
            cp "${selected_apks[0]}" android-smoke/app-under-test.apk
          else
            if [[ -z "${APK_URL}" ]]; then
              echo "Set either build_run_id or apk_url." >&2
              exit 1
            fi
            curl --fail --location --retry 3 --output android-smoke/app-under-test.apk "${APK_URL}"
          fi
          sha256sum android-smoke/app-under-test.apk | tee android-smoke/apk-sha256.txt
          test "$(stat --format='%s' android-smoke/app-under-test.apk)" -gt 1000000

      - name: Explain skipped unpublished debug diagnostic
        if: ${{ matrix.apk-kind == 'debug' && inputs.build_run_id == '' }}
        shell: bash
        run: echo "Debug diagnostics require build_run_id; apk_url intentionally represents only the public signed release."

      - name: Enable KVM
        if: ${{ matrix.apk-kind != 'debug' || inputs.build_run_id != '' }}
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch three times, and capture logcat
        if: ${{ matrix.apk-kind != 'debug' || inputs.build_run_id != '' }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          ram-size: ${{ matrix.ram-mb }}M
          heap-size: ${{ matrix.heap-mb }}M
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -no-boot-anim -noaudio
            -gpu swiftshader_indirect -camera-back none
          script: >-
            bash scripts/android-launch-diagnostics.sh
            android-smoke/app-under-test.apk android-smoke ${{ matrix.expect }}
            com.huilaishi.app.samsung .LauncherActivity

      - name: Upload complete diagnostics
        if: ${{ always() && (matrix.apk-kind != 'debug' || inputs.build_run_id != '') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-launch-api-${{ matrix.api-level }}-${{ matrix.ram-mb }}mb-${{ matrix.expect }}-${{ matrix.apk-kind }}
          path: android-smoke/**
          if-no-files-found: error
          retention-days: 14

  signed-upgrade-smoke:
    name: ${{ matrix.from }} signed upgrade / stale recent task
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - from: S1
            old_mode: auto
            old_url: https://github.com/axldsg99999-ship-it/huilaishi-app/releases/download/v12.2.5-samsung.1/huilaishi-samsung-12.2.5-s1-release.apk
          - from: R2
            old_mode: manual
            old_url: https://github.com/axldsg99999-ship-it/huilaishi-app/releases/download/v12.2.6-samsung.2/huilaishi-samsung-12.2.6-r2-release.apk
          - from: R3
            old_mode: course
            old_url: https://github.com/axldsg99999-ship-it/huilaishi-app/releases/download/v12.2.7-samsung.3/huilaishi-samsung-12.2.7-r3-release.apk
          - from: R1
            old_mode: course
            old_url: https://github.com/axldsg99999-ship-it/huilaishi-app/releases/download/v12.3.0-samsung.1/huilaishi-samsung-12.3.0-r1-release.apk

    steps:
      - name: Check out upgrade diagnostics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download old and new permanently signed APKs
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          APK_URL: ${{ inputs.apk_url }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
          OLD_APK_URL: ${{ matrix.old_url }}
        run: |
          set -euo pipefail
          mkdir -p android-upgrade/build-artifact
          if [[ -n "${BUILD_RUN_ID}" ]]; then
            gh run download "${BUILD_RUN_ID}" \
              --repo "${GITHUB_REPOSITORY}" \
              --name "${ARTIFACT_NAME}" \
              --dir android-upgrade/build-artifact
            mapfile -t release_apks < <(find android-upgrade/build-artifact -type f -name 'huilaishi-samsung-12.4.0-r1-release.apk' -print)
            if [[ "${#release_apks[@]}" -ne 1 ]]; then
              echo "Expected exactly one signed 12.4 R1 release APK; found ${#release_apks[@]}." >&2
              exit 1
            fi
            cp "${release_apks[0]}" android-upgrade/new-release.apk
          else
            if [[ -z "${APK_URL}" ]]; then
              echo "Set either build_run_id or apk_url." >&2
              exit 1
            fi
            curl --fail --location --retry 3 \
              --output android-upgrade/new-release.apk "${APK_URL}"
          fi
          curl --fail --location --retry 3 \
            --output android-upgrade/old-release.apk "${OLD_APK_URL}"
          sha256sum android-upgrade/old-release.apk android-upgrade/new-release.apk \
            | tee android-upgrade/apk-sha256.txt
          test "$(stat --format='%s' android-upgrade/old-release.apk)" -gt 1000000
          test "$(stat --format='%s' android-upgrade/new-release.apk)" -gt 1000000

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore the old recent task, upgrade in place, and reopen it
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: default
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -no-boot-anim -noaudio
            -gpu swiftshader_indirect -camera-back none
          script: >-
            bash scripts/android-upgrade-diagnostics.sh
            android-upgrade/old-release.apk android-upgrade/new-release.apk
            android-upgrade ${{ matrix.old_mode }}

      - name: Upload complete upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-signed-upgrade-${{ matrix.from }}-to-12.4-R1
          path: |
            android-upgrade/**
            !android-upgrade/*.apk
            !android-upgrade/build-artifact/**
          if-no-files-found: error
          retention-days: 14
