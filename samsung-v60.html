<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3ead8" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <link rel="icon" href="data:," />
  <title>萨瓦迪卡 · 三星稳定入口</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { color: #251d19; background: #f3ead8; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
    button, a { font: inherit; }
    .safe-shell {
      position: fixed; top: 0; right: 0; bottom: 0; left: 0; overflow: auto;
      padding: max(22px, env(safe-area-inset-top, 0px)) 18px max(22px, env(safe-area-inset-bottom, 0px));
      background:
        radial-gradient(circle at 88% 4%, rgba(194, 69, 85, .16), transparent 190px),
        linear-gradient(rgba(43, 113, 103, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(43, 113, 103, .035) 1px, transparent 1px),
        #f3ead8;
      background-size: auto, 18px 18px, 18px 18px, auto;
    }
    .card { max-width: 430px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .seal { width: 48px; height: 48px; display: grid; place-items: center; color: #fff9ed; background: #a93f35; border-radius: 13px; font-size: 22px; font-weight: 900; }
    .brand b { display: block; font-size: 19px; }
    .brand small { color: #2b7167; font-size: 11px; font-weight: 750; }
    .hero { margin: 30px 0 20px; }
    .eyebrow { margin: 0 0 8px; color: #a93f35; font-size: 11px; font-weight: 900; letter-spacing: .1em; }
    h1 { margin: 0; font-size: clamp(35px, 10.5vw, 49px); line-height: .98; letter-spacing: -.055em; }
    h1 em { color: #a93f35; font-style: normal; }
    .lead { margin: 15px 0 0; color: #665a50; font-size: 14px; line-height: 1.7; }
    .proof { margin: 0 0 18px; padding: 15px; background: rgba(255, 250, 238, .86); border: 1px solid rgba(37, 29, 25, .13); border-radius: 18px; }
    .proof strong { display: block; color: #2b7167; font-size: 15px; }
    .proof p { margin: 6px 0 0; color: #665a50; font-size: 12px; line-height: 1.55; }
    .steps { display: grid; gap: 8px; margin-bottom: 18px; }
    .step { min-height: 49px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(255, 250, 238, .72); border: 1px solid rgba(37, 29, 25, .1); border-radius: 14px; }
    .step i { width: 25px; height: 25px; display: grid; place-items: center; flex: 0 0 25px; color: #fff; background: #2b7167; border-radius: 50%; font-size: 12px; font-style: normal; font-weight: 900; }
    .step.waiting i { background: #b99a53; }
    .step b { font-size: 13px; }
    .step small { display: block; margin-top: 2px; color: #776b61; font-size: 10px; }
    .primary { width: 100%; min-height: 58px; padding: 12px 16px; border: 0; border-radius: 17px; color: #fff9ed; background: #24334f; font-weight: 900; box-shadow: 0 6px 0 #172238; }
    .primary:disabled { opacity: .55; box-shadow: none; }
    .secondary { display: block; margin-top: 16px; color: #7d2b25; text-align: center; font-size: 12px; font-weight: 800; }
    details { margin-top: auto; padding-top: 22px; color: #766b61; font-size: 10px; }
    summary { min-height: 40px; display: flex; align-items: center; cursor: pointer; }
    #diagnostic { margin: 6px 0 0; padding: 10px; overflow-wrap: anywhere; color: #554b43; background: rgba(255,255,255,.42); border-radius: 10px; line-height: 1.55; }
    .frame-stage { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 90; display: none; overflow: hidden; background: #f3ead8; }
    .frame-stage.active { display: block; }
    .frame-stage iframe { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; border: 0; opacity: 0; visibility: hidden; background: #f3ead8; }
    .frame-stage.ready iframe { opacity: 1; visibility: visible; }
    .frame-wait { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 2; display: grid; place-items: center; padding: 28px; background: #f3ead8; }
    .frame-stage.ready .frame-wait { display: none; }
    .wait-card { width: min(100%, 330px); padding: 24px; text-align: center; background: #fff9ed; border: 1px solid rgba(37,29,25,.14); border-radius: 22px; box-shadow: 0 15px 40px rgba(37,29,25,.12); }
    .wait-mark { width: 54px; height: 54px; display: grid; place-items: center; margin: 0 auto 15px; color: #fff9ed; background: #2b7167; border-radius: 16px; font-size: 24px; font-weight: 900; }
    .wait-card strong { display: block; font-size: 18px; }
    .wait-card p { margin: 8px 0 0; color: #6c6057; font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="safe-shell">
    <section class="card">
      <header class="brand"><span class="seal">萨</span><div><b>萨瓦迪卡</b><small>สวัสดีค่ะ · SAMSUNG STABLE</small></div></header>
      <div class="hero">
        <p class="eyebrow">V60 · 三星当前页模式</p>
        <h1>不跳转，<br><em>不再留下空白页。</em></h1>
        <p class="lead">应用会直接在这一页里面启动。主菜单没有完全画好之前，这张安全页会一直保留。</p>
      </div>
      <section class="proof" role="status" aria-live="polite">
        <strong id="status-title">安全页已经显示</strong>
        <p id="status-copy">正在移除只属于萨瓦迪卡的旧网页控制器和缓存，不会删除其他网站的数据。</p>
      </section>
      <div class="steps" aria-label="恢复进度">
        <div class="step"><i>✓</i><div><b>页面绘制正常</b><small>这个界面不会自动消失</small></div></div>
        <div class="step waiting" id="cleanup-step"><i>2</i><div><b>清理旧启动缓存</b><small id="cleanup-state">处理中</small></div></div>
        <div class="step waiting" id="launch-step"><i>3</i><div><b>当前页面内启动</b><small>不打开新标签，不离开安全页</small></div></div>
      </div>
      <button class="primary" id="launch" type="button" disabled>正在准备三星稳定模式…</button>
      <a class="secondary" href="https://github.com/axldsg99999-ship-it/huilaishi-app/releases/download/v12.6.0-samsung.1/huilaishi-samsung-12.6.0-r1-release.apk">备用：下载三星 APK</a>
      <details><summary>查看启动诊断</summary><p id="diagnostic">正在读取…</p></details>
    </section>
  </main>
  <section class="frame-stage" id="frame-stage" aria-label="萨瓦迪卡主应用">
    <div class="frame-wait">
      <div class="wait-card"><span class="wait-mark">萨</span><strong id="wait-title">正在当前页面启动</strong><p id="wait-copy">安全页仍在下面；确认主菜单画好后才会显示应用。</p></div>
    </div>
  </section>
  <script>
    (function () {
      "use strict";
      var launch = document.getElementById("launch");
      var cleanupStep = document.getElementById("cleanup-step");
      var cleanupState = document.getElementById("cleanup-state");
      var launchStep = document.getElementById("launch-step");
      var statusTitle = document.getElementById("status-title");
      var statusCopy = document.getElementById("status-copy");
      var diagnostic = document.getElementById("diagnostic");
      var frameStage = document.getElementById("frame-stage");
      var waitTitle = document.getElementById("wait-title");
      var waitCopy = document.getElementById("wait-copy");
      var cleanupFinished = false;
      var launchTimer = 0;
      var monitorTimer = 0;
      var appFrame = null;
      var appVisible = false;

      function markReady(workerCount, cacheCount) {
        if (cleanupFinished) return;
        cleanupFinished = true;
        cleanupStep.className = "step";
        cleanupStep.getElementsByTagName("i")[0].textContent = "✓";
        cleanupState.textContent = "已处理 " + workerCount + " 个旧控制器、" + cacheCount + " 个旧缓存";
        launchStep.className = "step";
        launchStep.getElementsByTagName("i")[0].textContent = "✓";
        launch.disabled = false;
        launch.textContent = "在当前页面打开萨瓦迪卡";
        statusTitle.textContent = "当前页模式已准备好";
        statusCopy.textContent = "点击后只会覆盖当前页面，不会再创建可能变空白的新标签。";
        diagnostic.textContent = "secure=" + String(window.isSecureContext) + " · sw=" + workerCount + " · cache=" + cacheCount + " · " + navigator.userAgent;
      }

      function ownedWorkerTask() {
        if (!("serviceWorker" in navigator) || !navigator.serviceWorker.getRegistrations) return Promise.resolve(0);
        return navigator.serviceWorker.getRegistrations().then(function (registrations) {
          var owned = registrations.filter(function (registration) { return registration.scope.indexOf("/huilaishi-app/") >= 0; });
          return Promise.all(owned.map(function (registration) { return registration.unregister(); })).then(function () { return owned.length; });
        }).catch(function () { return 0; });
      }

      function ownedCacheTask() {
        if (!("caches" in window) || !caches.keys) return Promise.resolve(0);
        return caches.keys().then(function (keys) {
          var owned = keys.filter(function (key) { return key.indexOf("huilaishi-") === 0; });
          return Promise.all(owned.map(function (key) { return caches.delete(key); })).then(function () { return owned.length; });
        }).catch(function () { return 0; });
      }

      function restoreSafety(message) {
        appVisible = false;
        window.clearTimeout(launchTimer);
        window.clearInterval(monitorTimer);
        if (appFrame && appFrame.parentNode) appFrame.parentNode.removeChild(appFrame);
        appFrame = null;
        frameStage.className = "frame-stage";
        launch.disabled = false;
        launch.textContent = "重新在当前页面启动";
        statusTitle.textContent = "应用没有通过显示检查";
        statusCopy.textContent = message + " 安全页仍然可用，没有变成空白屏。";
      }

      function frameIsPainted() {
        try {
          if (!appFrame || !appFrame.contentDocument) return false;
          var doc = appFrame.contentDocument;
          var shell = doc.getElementById("app");
          if (!doc.documentElement || doc.documentElement.getAttribute("data-app-ready") !== "true" || !doc.body || !shell) return false;
          var rect = shell.getBoundingClientRect();
          return doc.body.innerText.replace(/\s/g, "").length > 80 && rect.width > 240 && rect.height > 280;
        } catch (_) {
          return false;
        }
      }

      function revealFrame() {
        if (appVisible || !frameIsPainted()) return;
        appVisible = true;
        window.clearTimeout(launchTimer);
        frameStage.className = "frame-stage active ready";
        try {
          var controlled = Boolean(appFrame.contentWindow.navigator.serviceWorker && appFrame.contentWindow.navigator.serviceWorker.controller);
          diagnostic.textContent += " · frameReady=true · frameControlled=" + String(controlled);
        } catch (_) {}
        monitorTimer = window.setInterval(function () {
          if (!frameIsPainted()) restoreSafety("检测到主应用画面消失，已自动退回。");
        }, 1800);
      }

      function launchInsideCurrentPage() {
        launch.disabled = true;
        launch.textContent = "正在当前页面启动…";
        frameStage.className = "frame-stage active";
        waitTitle.textContent = "正在当前页面启动";
        waitCopy.textContent = "正在确认主菜单、尺寸和旧控制器状态；完成前不会切成空白画面。";
        appFrame = document.createElement("iframe");
        appFrame.title = "萨瓦迪卡主应用";
        appFrame.setAttribute("allow", "microphone; autoplay");
        var navigated = false;
        appFrame.addEventListener("load", function () {
          if (!navigated) {
            navigated = true;
            window.setTimeout(function () {
              try {
                appFrame.contentWindow.location.replace("./?nosw=1&build=v60&from=samsung-current&fresh=" + Date.now());
              } catch (_) {
                restoreSafety("当前页导航被浏览器阻止。");
              }
            }, 80);
            return;
          }
          window.setTimeout(revealFrame, 100);
        });
        appFrame.srcdoc = "<!doctype html><meta name=viewport content='width=device-width,initial-scale=1'><body style='margin:0;background:#f3ead8'>";
        frameStage.appendChild(appFrame);
        var probeTimer = window.setInterval(function () {
          if (appVisible || !appFrame) {
            window.clearInterval(probeTimer);
            return;
          }
          revealFrame();
        }, 180);
        launchTimer = window.setTimeout(function () {
          window.clearInterval(probeTimer);
          if (!appVisible) restoreSafety("等待 25 秒仍未检测到完整主菜单。");
        }, 25000);
      }

      Promise.all([ownedWorkerTask(), ownedCacheTask()]).then(function (result) { markReady(result[0], result[1]); });
      window.setTimeout(function () { markReady(0, 0); }, 3500);
      launch.addEventListener("click", launchInsideCurrentPage);
    }());
  </script>
</body>
</html>
