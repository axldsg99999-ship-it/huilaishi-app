<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#ece5d8"><meta name="description" content="XULONG pasa · 纸上六程，中泰双向语言游戏独立试玩。">
 <title>XULONG pasa · 纸上六程</title>
 <link rel="icon" href="./assets/seal.webp" type="image/webp">
 <link rel="stylesheet" href="./style.css?v=2">
 <link rel="stylesheet" href="./polish.css?v=2">
</head>
<body>
 <main id="stage" aria-label="XULONG pasa 纸上六程">
  <canvas id="world" width="1280" height="720" aria-hidden="true"></canvas>
  <div id="wash" aria-hidden="true"></div>
  <header id="header"></header>
  <section id="home"></section>
  <section id="play" hidden aria-label="游戏操作">
   <div id="meter"></div><div id="objective"></div>
   <div id="controls"></div><div id="tools"></div>
   <div id="feedback" role="status" aria-live="polite"></div>
   <div id="hint"></div><div id="audio-status" role="status"></div>
  </section>
  <section id="overlay" hidden></section>
  <section id="loader"><span class="brand">XULONG <i>pasa</i></span><div class="loading-bird">✧</div><p>正在展开纸上的世界…</p><progress max="1" value="0"></progress></section>
 </main>
 <div id="rotate"><span class="rotate-device" aria-hidden="true"></span><h1>把设备横过来，展开这段旅途</h1><p>横屏体验 · 进度会保留</p></div>
 <noscript>本试玩需要启用 JavaScript。</noscript>
 <script type="module" src="./game.mjs?v=1"></script>
</body>
</html>
